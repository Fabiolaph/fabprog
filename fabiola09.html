            --color-cuarto: #6909BC;
            --color-quinto: #7B9E87;
        }
        * {
            box-sizing: border-box;
        }
        body {
            background-color: var(--color-primario);
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            margin: 0;
        }
        header {
            padding: 15px;
            display: flex;
            justify-content: flex-end;
            background-color: var(--color-secundario);
        }
        .search {
            background-color: var(--color-primario);
            border: 2px solid var(--color-terceario);
            border-radius: 50px;
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
            font-size: 15px;
            padding: 8px 15px;
            color: var(--color-terceario);
        }
        .search::placeholder {
            color: var(--color-terceario);
        }
        .search:focus {
            outline: none;
            background-color: var(--color-quinto);
        }
        main {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }
        .personaje {
            width: 400px;
            margin: 15px;
            background-color: var(--color-secundario);
            box-shadow: 10px 15px 1px var(--color-cuarto);
            position: relative;
            overflow: hidden;
            border-radius: 5px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
        }
        .personaje img {
            width: 80%;
            height: 400px;
            object-fit: contain;
        }
        .personaje-info {
            color: var(--color-terceario);
            display: Moderna;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            padding: 15px 15px 15px;
            letter-spacing: 5px;
        }
        .personaje-info h3 {
            margin-top: 0;
        }
        .personaje-info h1 {
            color: var(--color-primario);
            margin-top: 0;
        }
        .descripcion {
            background-color: var(--color-quinto);
            padding: 15px;
            position: absolute;
            left: 0;
            bottom: 0;
            right: 0;
            max-height: 100%;
            transform: translateY(101%);
            overflow-y: auto;
            transition: transform 0.3s ease-in;
        }
        .personaje:hover .descripcion {
            transform: translateY(0);
        }
    </style>

    <header>
        <form id="form">
            <img src="dragonball.jpg" alt="logo" styles="width: 100px;">
            <input type="text" id="search" class="search" placeholder="Buscar Personaje">
        </form>
    </header>
    <main id="main"></main>
    <script>
        const API_HP = 'https://hp-api.onrender.com/api/characters';
        const API_RICK = 'https://rickandmortyapi.com/api/character';
        const main = document.getElementById('main');
        const form = document.getElementById('form');
        const search = document.getElementById('search');

        getAllCharacters();

        async function getAllCharacters() {
            const [rmRes, hpRes] = await Promise.all([
                fetch(API_RICK).then(res => res.json()),
                fetch(API_HP).then(res => res.json())
            ]);

            const rickChars = rmRes.results || [];
            const hpChars = hpRes || [];
            showCharacters([...rickChars, ...hpChars]);
        }

        function showCharacters(characters) {
            main.innerHTML = '';
            characters.forEach((char) => {
                // Detecta de qué API es el personaje
                let id, name, image, ki, maxKi, description, race;
                if (char.hasOwnProperty('status') && char.hasOwnProperty('origin')) {
                    // Rick and Morty
                    id = char.id;
                    name = char.name;
                    image = char.image;
                    ki = char.status;
                    maxKi = char.type || 'N/A';
                    description = `<strong>Origen:</strong> ${char.origin?.name || ''}`;
                    race = char.species || '';
                } else {
                    // Harry Potter
                    id = char.id || '';
                    name = char.name;
                    image = char.image || 'https://upload.wikimedia.org/wikipedia/commons/a/ac/No_image_available.svg';
                    ki = char.wand?.wood || 'N/A';
                    maxKi = char.wand?.core || 'N/A';
                    description = `<strong>Casa:</strong> ${char.house || 'Desconocida'}<br><strong>Patronus:</strong> ${char.patronus || 'Desconocido'}<br><strong>Actor:</strong> ${char.actor || 'Desconocido'}`;
                    race = char.species || '';
                }
                const charElement = document.createElement('div');
                charElement.classList.add('personaje');
                charElement.innerHTML = `
                    <img src="${image}" alt="${name}">
                    <div class="personaje-info">
                        <h1>${id}</h1>
                        <h3>${name}</h3>
                        <br>
                        ${race}
                    </div>
                    <div class="descripcion">
                        <h3>Descripcion</h3>
                        ${description}
                        <p><strong>Ki:</strong> ${ki}</p>
                        <p><strong>Max Ki:</strong> ${maxKi}</p>
                        <p>${description || "Sin descripcion disponible"}</p>
                    </div>
                `;
                main.appendChild(charElement);
            });
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const searchTerm = search.value.trim().toLowerCase();
            if (searchTerm && searchTerm !== '') {
                const [rmRes, hpRes] = await Promise.all([
                    fetch(API_RICK).then(res => res.json()),
                    fetch(API_HP).then(res => res.json())
                ]);
                const rickChars = (rmRes.results || []).filter(char => char.name.toLowerCase().includes(searchTerm));
                const hpChars = (hpRes || []).filter(char => char.name.toLowerCase().includes(searchTerm));
                showCharacters([...rickChars, ...hpChars]);
                search.value = '';
            } else {
                window.location.reload();
            }
        });
    </script>
